version: "3.9"

networks:
  poc_net:
    driver: bridge

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: poc_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - poc_net
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: poc_postgres
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
      POSTGRES_DB: poc_mqtt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - poc_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d poc_mqtt"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: poc_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://poc:poc@postgres:5432/poc_mqtt
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      MQTT_TOPIC: machines/events
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - poc_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: poc_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - postgres
    networks:
      - poc_net
    restart: unless-stopped
    profiles:
      - monitoring

